<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Messages 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #03030a;
    font-family: Georgia, 'Times New Roman', serif;
    cursor: pointer;
    touch-action: none;
    user-select: none;
  }
  canvas { display: block; }
  .hint {
    position: fixed;
    bottom: 7%;
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, .55);
    font-style: italic;
    letter-spacing: 2px;
    font-size: 15px;
    pointer-events: none;
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .3; }
    50%      { opacity: .85; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">Cliquez n'importe où pour envoyer un cœur</div>

<script>
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);

let W = innerWidth, H = innerHeight;
function resize() {
  W = innerWidth; H = innerHeight;
  cv.width = W; cv.height = H;
  initField();
}
addEventListener('resize', resize);

/* ---------------- Champs d'étoiles et particules ambiantes ---------------- */
let stars = [], ambient = [];
function initField() {
  stars = Array.from({ length: 170 }, () => ({
    x: rand(0, W), y: rand(0, H), r: rand(.4, 1.5),
    p: rand(0, TAU), s: rand(.6, 2.2)
  }));
  ambient = Array.from({ length: 45 }, () => ({
    x: rand(0, W), y: rand(0, H), r: rand(1, 3),
    vx: rand(-.15, .15), vy: rand(-.3, -.05),
    p: rand(0, TAU),
    c: ['#6aa8ff', '#b48cff', '#ff9ecb', '#8fd0ff'][Math.floor(rand(0, 4))]
  }));
}
initField();

/* ---------------- Collections d'objets animés ---------------- */
const bursts     = [];  // particules d'explosion (points + mini-cœurs)
const floaters   = [];  // petits cœurs qui s'élèvent après un clic
const boomHearts = [];  // gros cœur d'explosion au clic
const arrows     = [];  // flèches en vol
const messages   = [];  // messages romantiques

/* ---------------- Trace un cœur (origine = centre, s = taille) ---------------- */
function heartPath(c, s) {
  c.beginPath();
  c.moveTo(0, s * .32);
  c.bezierCurveTo( s * .55, -s * .4,  s * 1.15, s * .12, 0, s);
  c.bezierCurveTo(-s * 1.15,  s * .12, -s * .55, -s * .4, 0, s * .32);
  c.closePath();
}

/* ---------------- Explosion de particules ---------------- */
function burst(x, y, n = 70) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(1, 5.5);
    bursts.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: rand(.008, .018),
      r: rand(1, 2.8),
      c: ['#7fb2ff', '#c39bff', '#ffffff', '#ffb3d9', '#9fd8ff'][Math.floor(rand(0, 5))],
      heart: Math.random() < .3, s: rand(3, 7)
    });
  }
}

/* ---------------- Messages romantiques ---------------- */
const MSGS = ['I Love You Aruna', 'Forever Yours', 'Just both of us',
              'My heart desire', 'My Love', "You're My Everything"];
let mi = 0;
function spawnMessage() {
  const y = H * rand(.30, .42);
  messages.push({ text: MSGS[mi++ % MSGS.length], t: 0, dur: 220, y });
  burst(W / 2, y, 85);
}
setInterval(spawnMessage, 2300);

/* ---------------- Arc, visée et tir ---------------- */
const bow = () => ({ x: Math.max(60, W * .08), y: H * .35 });
let aim = 0;
addEventListener('pointermove', e => {
  const b = bow();
  aim = Math.atan2(e.clientY - b.y, e.clientX - b.x);
});
addEventListener('pointerdown', e => {
  const b = bow();
  const dist = Math.hypot(e.clientX - b.x, e.clientY - b.y) || 1;
  arrows.push({
    x0: b.x, y0: b.y, x1: e.clientX, y1: e.clientY,
    t: 0, dur: Math.min(Math.max(dist / 15, 18), 50), // ~900 px/s
    ang: Math.atan2(e.clientY - b.y, e.clientX - b.x)
  });
});

function explode(x, y) {
  boomHearts.push({ x, y, t: 0 });
  burst(x, y, 60);
  for (let i = 0; i < 26; i++) {          // pluie de mini-cœurs
    const a = rand(0, TAU), sp = rand(1, 4);
    bursts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 1, decay: rand(.01, .02), r: 2,
      c: '#ff7fa8', heart: true, s: rand(4, 9)
    });
  }
  for (let i = 0; i < 6; i++)             // cœurs qui s'élèvent
    floaters.push({ x: x + rand(-20, 20), y: y - 10, vy: rand(-1.2, -.6), t: 0, s: rand(6, 11) });
}

/* ---------------- Boucle principale ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 16.667, 3); // 1 ≈ une frame à 60 fps
  last = now;

  /* fond dégradé nuit */
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0a1c');
  bg.addColorStop(.5, '#060612');
  bg.addColorStop(1, '#03030a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* étoiles scintillantes */
  for (const s of stars) {
    ctx.globalAlpha = (.25 + .75 * Math.abs(Math.sin(now * .001 * s + s.p))) * .8;
    ctx.fillStyle = '#cfe0ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* particules ambiantes dérivantes (mode additif) */
  ctx.globalCompositeOperation = 'lighter';
  for (const p of ambient) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y < -10) { p.y = H + 10; p.x = rand(0, W); }
    if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
    ctx.globalAlpha = .25 + .45 * (.5 + .5 * Math.sin(now * .002 + p.p));
    ctx.shadowColor = p.c; ctx.shadowBlur = 9; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  /* flèches en vol */
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.t += dt;
    const k = Math.min(a.t / a.dur, 1);
    const x = a.x0 + (a.x1 - a.x0) * k;
    const y = a.y0 + (a.y1 - a.y0) * k;
    // traînée lumineuse
    bursts.push({ x, y, vx: rand(-.3, .3), vy: rand(-.3, .3),
                  life: .6, decay: .04, r: 1.2, c: '#ffd9e8', heart: false, s: 3 });
    if (k >= 1) { explode(a.x1, a.y1); arrows.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(x, y); ctx.rotate(a.ang);
    ctx.strokeStyle = 'rgba(235,238,250,.95)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(14, 0); ctx.stroke();
    ctx.fillStyle = '#ff8fb0'; heartPath(ctx, 7); ctx.fill();   // pointe en cœur
    ctx.strokeStyle = 'rgba(200,210,235,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-33, -5);
    ctx.moveTo(-26, 0); ctx.lineTo(-33, 5); ctx.stroke();      // empennage
    ctx.restore();
  }

  /* explosions de particules */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = bursts.length - 1; i >= 0; i--) {
    const p = bursts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(.96, dt); p.vy *= Math.pow(.96, dt);
    p.vy += .015 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) { bursts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.shadowColor = p.c; ctx.shadowBlur = 10; ctx.fillStyle = p.c;
    if (p.heart) {
      ctx.save(); ctx.translate(p.x, p.y);
      heartPath(ctx, p.s * (.5 + p.life * .5)); ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  /* messages romantiques */
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `italic ${Math.min(W * .075, 44)}px Georgia, serif`;
  for (let i = messages.length - 1; i >= 0; i--) {
    const m = messages[i]; m.t += dt;
    if (m.t >= m.dur) { messages.splice(i, 1); continue; }
    let a = 1;
    if (m.t < 42) a = m.t / 42;
    else if (m.t > m.dur - 66) a = (m.dur - m.t) / 66;
    const sc = .92 + .08 * Math.min(1, m.t / 30);
    ctx.save();
    ctx.translate(W / 2, m.y);
    ctx.scale(sc, sc);
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.shadowColor = 'rgba(190,215,255,.95)';
    ctx.shadowBlur = 26;
    ctx.fillStyle = '#f4f7ff';
    ctx.fillText(m.text, 0, 0);
    ctx.restore();
  }
  ctx.restore();

  /* petits cœurs flottants */
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt; f.y += f.vy * dt;
    if (f.t > 132) { floaters.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.globalAlpha = f.t < 24 ? f.t / 24 : Math.max(0, 1 - (f.t - 24) / 108);
    ctx.shadowColor = 'rgba(255,130,175,.8)'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff8fb0';
    heartPath(ctx, f.s); ctx.fill();
    ctx.restore();
  }

  /* gros cœur d'explosion (clic) */
  for (let i = boomHearts.length - 1; i >= 0; i--) {
    const h = boomHearts[i]; h.t += dt;
    const T = 96;
    if (h.t >= T) { boomHearts.splice(i, 1); continue; }
    let sc = 1, alpha = 1;
    if (h.t < 21) sc = 1 - Math.pow(1 - h.t / 21, 3);
    else alpha = Math.max(0, 1 - (h.t - 21) / (T - 21));
    const s = 55 * sc;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(255,120,170,.9)'; ctx.shadowBlur = 30;
    const g = ctx.createLinearGradient(0, -s, 0, s);
    g.addColorStop(0, '#ff9dbb'); g.addColorStop(1, '#ff5f92');
    ctx.fillStyle = g;
    heartPath(ctx, s); ctx.fill();
    ctx.restore();
  }

  /* l'arc (visée suivant le curseur) */
  const b = bow();
  ctx.save();
  ctx.translate(b.x, b.y); ctx.rotate(aim);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(215,222,240,.9)'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, 44, -1.15, 1.15); ctx.stroke();   // branches
  const tx = Math.cos(1.15) * 44, ty = Math.sin(1.15) * 44;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(tx, -ty);
  ctx.quadraticCurveTo(-6, 0, tx, ty); ctx.stroke();              // corde
  ctx.strokeStyle = 'rgba(235,238,250,.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(52, 0); ctx.stroke(); // flèche encochée
  ctx.fillStyle = '#ff8fb0'; heartPath(ctx, 6.5); ctx.fill();
  ctx.restore();

  requestAnimationFrame(loop);
}
spawnMessage();
requestAnimationFrame(loop);
</script>
</body>
  </html>
